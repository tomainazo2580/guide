<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide - Révisions scolaires Madagascar</title>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
  });
}
if ('caches' in window) {
  caches.keys().then(function(noms) {
    for (var i = 0; i < noms.length; i++) { caches.delete(noms[i]); }
  });
}
</script>
<link rel="stylesheet" href="css/style.css?v=3.20">
<style>
/* Mise en page : en-tête en haut, contenu qui défile au milieu, barre en bas */
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}
body {
  display: flex;
  flex-direction: column;
}
header {
  flex-shrink: 0;
  position: relative;
}
#ecran {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.barre-bas {
  flex-shrink: 0;
  display: flex;
  background-color: #FFFFFF;
  border-top: 1px solid #E0E0E0;
  box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08);
}
.barre-bas button {
  flex: 1;
  padding: 8px 0;
  background: none;
  border: none;
  color: #1565C0;
  font-size: 12px;
  line-height: 1.3;
  cursor: pointer;
}
.barre-bas button .ico {
  font-size: 22px;
}
</style>
</head>
<body>
<header>
  <h1>📘 Guide</h1>
  <p>Réussis ton année scolaire 🇲🇬</p>
</header>
<main id="ecran"></main>
<nav class="barre-bas">
  <button onclick="afficherAccueil()"><span class="ico">🏠</span><br>Accueil</button>
  <button onclick="afficherRecherche()"><span class="ico">🔍</span><br>Recherche</button>
  <button onclick="afficherPropos()"><span class="ico">ℹ️</span><br>À propos</button>
</nav>
<script src="js/data.js?v=3.20"></script>
<script src="js/app.js?v=3.20"></script>
</body>
</html>

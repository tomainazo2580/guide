<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>Guide — Révisions Madagascar</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<script>
// Nettoyage automatique des anciennes versions en cache
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
  });
}
if (window.caches) {
  caches.keys().then(function(noms) {
    for (var i = 0; i < noms.length; i++) { caches.delete(noms[i]); }
  });
}
</script>
</head>
<body>

<header class="haut">
  <div class="haut-titre">📘 Guide</div>
  <div class="haut-sous-titre">Réussis ton année scolaire 🇲🇬</div>
</header>

<main id="ecran" class="ecran"></main>

<nav class="bas">
  <button class="bas-btn actif" id="btn-accueil" onclick="afficherAccueil()">
    <span class="bas-icone">🏠</span>
    <span class="bas-label">Accueil</span>
  </button>
  <button class="bas-btn" id="btn-recherche" onclick="afficherRecherche()">
    <span class="bas-icone">🔍</span>
    <span class="bas-label">Recherche</span>
  </button>
  <button class="bas-btn" id="btn-propos" onclick="afficherPropos()">
    <span class="bas-icone">ℹ️</span>
    <span class="bas-label">À propos</span>
  </button>
</nav>

<script src="js/data.js"></script>
<script src="js/app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide - Révisions scolaires Madagascar</title>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
  });
}
if ('caches' in window) {
  caches.keys().then(function(noms) {
    for (var i = 0; i < noms.length; i++) { caches.delete(noms[i]); }
  });
}
</script>
<link rel="stylesheet" href="css/style.css?v=3.11">
<style>
/* Barre de navigation du bas (intégrée ici en attendant le design final) */
.barre-bas {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background-color: #FFFFFF;
  border-top: 1px solid #E0E0E0;
  box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08);
  z-index: 1000;
}
.barre-bas button {
  flex: 1;
  padding: 6px 0;
  background: none;
  border: none;
  color: #1565C0;
  font-size: 12px;
  line-height: 1.3;
  cursor: pointer;
}
.barre-bas button .ico {
  font-size: 22px;
}
body {
  padding-bottom: 70px;
}
</style>
</head>
<body>
<header>
  <h1>📘 Guide</h1>
  <p>Réussis ton année scolaire 🇲🇬</p>
</header>
<main id="ecran"></main>
<nav class="barre-bas">
  <button onclick="afficherAccueil()"><span class="ico">🏠</span><br>Accueil</button>
  <button onclick="afficherRecherche()"><span class="ico">🔍</span><br>Recherche</button>
  <button onclick="afficherPropos()"><span class="ico">ℹ️</span><br>À propos</button>
</nav>
<script src="js/data.js?v=3.11"></script>
<script src="js/app.js?v=3.11"></script>
</body>
</html>

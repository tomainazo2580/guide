<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Guide — Révision BEPC</title>
<meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.png">
<link rel="apple-touch-icon" href="./icons/icon.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body data-theme="clair">

<header class="app-header">
  <button id="btn-retour" class="btn-retour" aria-label="Retour" hidden>←</button>
  <h1 id="titre-header" class="titre-header">Guide</h1>
  <button id="btn-theme" class="btn-theme" aria-label="Changer de thème">🌙</button>
</header>

<main id="contenu-principal">

  <section id="view-classes" class="view" hidden>
    <p class="sous-titre-accueil">Tu es en quelle classe ?</p>
    <div id="grille-classes" class="grille-classes"></div>
  </section>

  <section id="view-matieres" class="view" hidden>
    <p class="sous-titre-accueil" id="sous-titre-matieres">Choisis ta matière</p>
    <div id="zone-reprendre" hidden></div>
    <div id="grille-matieres" class="grille-matieres"></div>
  </section>

  <section id="view-matiere" class="view" hidden>
    <nav id="fil-ariane" class="fil-ariane"></nav>
    <div id="matiere-contenu"></div>
  </section>

  <section id="view-notes" class="view" hidden>
    <h2 class="titre-vue">📒 Mes notes</h2>
    <div id="notes-contenu"></div>
  </section>

  <section id="view-parametres" class="view" hidden>
    <h2 class="titre-vue">⚙️ Paramètres</h2>

    <div class="bloc-parametre">
      <h3>Ma classe</h3>
      <p class="texte-parametre" id="texte-classe-actuelle">Classe actuelle : —</p>
      <button id="btn-changer-classe" class="btn-secondaire">🔄 Changer de classe</button>
    </div>

    <div class="bloc-parametre">
      <h3>Progression</h3>
      <p class="texte-parametre">Tu peux réinitialiser ta progression de lecture si tu veux repartir de zéro.</p>
      <button id="btn-reset-progression" class="btn-danger">🗑️ Réinitialiser ma progression</button>
    </div>

    <div class="bloc-parametre">
      <h3>À propos</h3>
      <p class="texte-parametre">Guide — application de révision hors ligne.<br>Version 0.7</p>
    </div>
  </section>

</main>

<nav class="nav-basse">
  <button class="nav-btn" data-nav="accueil">
    <span class="nav-icone">🏠</span><span class="nav-texte">Accueil</span>
  </button>
  <button class="nav-btn" data-nav="notes">
    <span class="nav-icone">📒</span><span class="nav-texte">Mes notes</span>
  </button>
  <button class="nav-btn" data-nav="parametres">
    <span class="nav-icone">⚙️</span><span class="nav-texte">Réglages</span>
  </button>
</nav>

<script src="./js/app.js"></script>
</body>
</html>

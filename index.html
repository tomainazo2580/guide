<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide - Révision BEPC</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon.svg">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="app-header">
  <div class="logo">📘 Guide</div>
  <button id="theme-toggle" class="theme-toggle">🌙</button>
</header>

<main>

  <!-- VUE ACCUEIL -->
  <div id="view-accueil" class="view active">
    <h2 class="section-title">Mes matières</h2>
    <div class="grille-matieres">
      <div class="carte-matiere" data-matiere="maths">
        <div class="icone-matiere">📐</div>
        <div class="nom-matiere">Mathématiques</div>
      </div>
      <div class="carte-matiere" data-matiere="francais">
        <div class="icone-matiere">📖</div>
        <div class="nom-matiere">Français</div>
      </div>
      <div class="carte-matiere" data-matiere="malagasy">
        <div class="icone-matiere">🗣️</div>
        <div class="nom-matiere">Malagasy</div>
      </div>
      <div class="carte-matiere" data-matiere="histoiregeo">
        <div class="icone-matiere">🌍</div>
        <div class="nom-matiere">Histoire-Géo</div>
      </div>
      <div class="carte-matiere" data-matiere="sciences">
        <div class="icone-matiere">🔬</div>
        <div class="nom-matiere">Sciences</div>
      </div>
      <div class="carte-matiere" data-matiere="anglais">
        <div class="icone-matiere">🇬🇧</div>
        <div class="nom-matiere">Anglais</div>
      </div>
    </div>
  </div>

  <!-- VUE MATIERE (cours) -->
  <div id="view-matiere" class="view">
    <div class="breadcrumb">
      <button id="btn-back" class="btn-back">← Retour</button>
      <h2 id="matiere-titre">Matière</h2>
    </div>
    <div id="matiere-content"></div>
  </div>

  <!-- VUE MES NOTES -->
  <div id="view-notes" class="view">
    <h2 class="section-title">Mes notes</h2>
    <p class="placeholder-text">Tu pourras bientôt ajouter tes propres notes ici.</p>
  </div>

  <!-- VUE PARAMETRES -->
  <div id="view-parametres" class="view">
    <h2 class="section-title">Réglages</h2>
    <p class="placeholder-text">Version 0.3 — Guide BEPC</p>
  </div>

</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="accueil">🏠<span>Accueil</span></button>
  <button class="nav-btn" data-view="notes">📝<span>Mes notes</span></button>
  <button class="nav-btn" data-view="parametres">⚙️<span>Réglages</span></button>
</nav>

<script src="./js/app.js"></script>
</body>
</html>

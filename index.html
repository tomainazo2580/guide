<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide - Révisions scolaires Madagascar</title>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
  });
}
if ('caches' in window) {
  caches.keys().then(function(noms) {
    for (var i = 0; i < noms.length; i++) { caches.delete(noms[i]); }
  });
}
</script>
<link rel="stylesheet" href="css/style.css?v=3.10">
</head>
<body>
<header>
  <h1>📘 Guide</h1>
  <p>Réussis ton année scolaire 🇲🇬</p>
</header>
<main id="ecran"></main>
<nav class="barre-bas">
  <button onclick="afficherAccueil()">🏠<br>Accueil</button>
  <button onclick="afficherRecherche()">🔍<br>Recherche</button>
  <button onclick="afficherPropos()">ℹ️<br>À propos</button>
</nav>
<script src="js/data.js?v=3.10"></script>
<script src="js/app.js?v=3.10"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur de codes — PRIVÉ</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: #0f172a;
    color: #e2e8f0;
    padding: 20px;
    max-width: 480px;
    margin: 0 auto;
  }
  .avertissement {
    background-color: #4a2424;
    color: #fca5a5;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    margin-top: 14px;
    color: #94a3b8;
  }
  select, input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #334155;
    background-color: #1e293b;
    color: #e2e8f0;
    font-size: 15px;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background-color: #5b9bd5;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .resultat {
    margin-top: 20px;
    padding: 16px;
    background-color: #1e293b;
    border-radius: 8px;
    text-align: center;
    font-family: monospace;
    font-size: 18px;
    font-weight: 700;
    color: #5b9bd5;
    word-break: break-all;
  }
</style>
</head>
<body>

<div class="avertissement">
  ⚠️ Usage personnel uniquement. Ne partage JAMAIS le lien de cette page à qui que ce soit, y compris aux élèves.
</div>

<h1>🔑 Générateur de codes Guide</h1>

<label for="select-classe">Classe de l'élève</label>
<select id="select-classe">
  <option value="3e">Troisième</option>
  <option value="tle">Terminale</option>
</select>

<label for="select-matiere">Matière</label>
<select id="select-matiere"></select>

<label for="input-serial">Numéro de série</label>
<input type="text" id="input-serial" maxlength="4">

<button id="btn-generer">Générer le code</button>

<div id="resultat" class="resultat" hidden></div>

<script>
const SEL_SECRET = "BEPC2026MDG";

const MATIERES_PAR_CLASSE = {
  '3e': [
    { code: 'MALG', nom: 'Malagasy' },
    { code: 'FRAN', nom: 'Français' },
    { code: 'ANGL', nom: 'Anglais' },
    { code: 'MATH', nom: 'Mathématiques' },
    { code: 'SVT',  nom: 'SVT' },
    { code: 'SPHY', nom: 'Sciences Physiques' },
    { code: 'HIST', nom: 'Histoire' },
    { code: 'GEOG', nom: 'Géographie' }
  ],
  'tle': [
    { code: 'MALG', nom: 'Malagasy' },
    { code: 'FRAN', nom: 'Français' },
    { code: 'ANGL', nom: 'Anglais' },
    { code: 'MATH', nom: 'Mathématiques' },
    { code: 'SVT',  nom: 'SVT' },
    { code: 'PCHI', nom: 'Physique / Chimie' },
    { code: 'HGEO', nom: 'Histoire-Géographie' },
    { code: 'PHIL', nom: 'Philosophie' }
  ]
};

function $(id) { return document.getElementById(id); }

function remplirMatieres() {
  const classeId = $('select-classe').value;
  const matieres = MATIERES_PAR_CLASSE[classeId] || [];
  $('select-matiere').innerHTML = matieres.map(m => `<option value="${m.code}">${m.nom}</option>`).join('');
  preRemplirSerial();
}

function cleCompteur() {
  return $('select-classe').value + '-' + $('select-matiere').value;
}

function preRemplirSerial() {
  const compteurs = JSON.parse(localStorage.getItem('guide-codes-generes') || '{}');
  const cle = cleCompteur();
  const dernier = compteurs[cle] || 0;
  const prochain = dernier + 1;
  $('input-serial').value = String(prochain).padStart(4, '0');
}

function calculerChecksum(classeId, matiereCode, serial) {
  const texte = classeId.toUpperCase() + matiereCode + serial + SEL_SECRET;
  let somme = 0;
  for (let i = 0; i < texte.length; i++) {
    somme += texte.charCodeAt(i) * (i + 1);
  }
  const checksum = somme % 10000;
  return String(checksum).padStart(4, '0');
}

$('select-classe').addEventListener('change', remplirMatieres);
$('select-matiere').addEventListener('change', preRemplirSerial);

$('btn-generer').addEventListener('click', () => {
  const classeId = $('select-classe').value;
  const matiereCode = $('select-matiere').value;
  const serial = $('input-serial').value.padStart(4, '0');

  const checksum = calculerChecksum(classeId, matiereCode, serial);
  const code = `GUIDE-${classeId.toUpperCase()}-${matiereCode}-${serial}-${checksum}`;

  $('resultat').textContent = code;
  $('resultat').hidden = false;

  const compteurs = JSON.parse(localStorage.getItem('guide-codes-generes') || '{}');
  compteurs[cleCompteur()] = parseInt(serial, 10);
  localStorage.setItem('guide-codes-generes', JSON.stringify(compteurs));
});

remplirMatieres();
</script>

</body>
</html>
